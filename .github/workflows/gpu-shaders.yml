# Fork CI: builds ONLY this fork's GPU shader scaler binaries (Windows x64 + Linux x64)
# and runs the fork's gtest suite headless in its own job (see JOB LAYOUT below).
#
# The Windows job reproduces the verified local cross-build (see GPU_SHADERS.md):
#   - MinGW-w64 cross toolchain (CMake/platforms/mingwcc64.toolchain.cmake), all deps vendored
#   - GCC14+ diag relaxation for vendored ZeroTier/miniupnpc C sources
#   - FULLY STATIC linking (-static -static-libgcc -static-libstdc++) so the exe runs on a
#     clean Windows install with NO MinGW runtime DLLs (libstdc++-6.dll, libgcc_s_seh-1.dll,
#     libwinpthread-1.dll). Without these flags the exe does not launch ("DLL errors").
#     The Package step FAILS the job if a MinGW runtime DLL ever sneaks back in.
# The Linux job is the mirror image for glibc portability (field report 2026-10-15: the
# ubuntu-24.04-built binary died on Debian 12 with "GLIBC_2.38 not found"):
#   - build inside a gcc:14-bookworm container — Debian 12 BASE (glibc 2.36 floor) with
#     GCC 14 in /usr/local. Plain debian:bookworm is NOT buildable: its GCC 12 has no
#     C++23 <format> header (dies at Source/utils/log.hpp:11 / format.hpp:3) and
#     gcc-13+ is not in the bookworm repos. The -bookworm suffix pins the base, so the
#     artifact still runs on Debian 12+, Ubuntu 24.04+, Fedora 38+, Arch current
#   - -static-libgcc -static-libstdc++ so no GLIBCXX_/CXXABI_ symbol versions are
#     required (full -static glibc is NOT viable: NSS breaks, Vulkan loader dlopens)
#   - Portability gate FAILS the job if the max GLIBC_ requirement exceeds 2.36 or any
#     GLIBCXX_/CXXABI_ requirement sneaks back in; ./devilutionx --version smoke-runs
#     the loader exactly as it would run on a Debian 12 box.
# Do NOT remove the CMAKE_C_FLAGS / CMAKE_EXE_LINKER_FLAGS lines below.
#
# SIZE LEVER (gc-sections) FIELD RESULT 2026-10-15: LOST on Windows.
#   0a39b81 (pre-lever)   devilutionx.exe 15,051,264 bytes
#   4b3071f (with flags)  devilutionx.exe 16,377,856 bytes  (+1.27 MB)
# PE/COFF mechanism: -ffunction-sections gives every function/data its own
# section; PE stores section NAMES in the COFF string table, and tens of
# thousands of long C++ mangled names (glslang worst) cost MBs that `strip`
# CANNOT remove (section headers reference them). Meanwhile PE --gc-sections
# is far weaker than ELF (no identical-code folding; .refptr indirections
# blunt the reachability walk), so savings never covered the overhead.
# => Windows job: flags REVERTED below.
# => Linux job: flags KEPT pending measurement - ELF GC is strong, so the
#    same lever may still win there. Judge from the linux-x64 artifact size
#    vs the pre-lever run; if it did not shrink, delete the 3 flag lines.
# Both Package steps now print exe size + section table every run, so the
# next size lever is evaluated from the CI log itself.
#
# JOB LAYOUT (2026-10-17): the gtest suite runs in its OWN job (linux-tests),
# not inside the Linux build job. The Linux job used to carry the full
# vendored-dep build AND the headless-GPU test run serially and clocked ~5x
# the Windows job; the split runs them in parallel and drops gtest + the
# test TUs from the binary build (-DBUILD_TESTING=OFF). Both Linux jobs
# configure with identical flags (except BUILD_TESTING) and share the
# ccache-linux- prefix, so the tests job's tree build is mostly cache hits.
#
# WINDOWS-NONSTATIC JOB (2026-10-18): the same MinGW cross build WITHOUT
# `-static -static-libgcc -static-libstdc++`. The exe then imports the MinGW
# runtime DLLs (libstdc++-6.dll, libgcc_s_seh-1.dll, libssp-0.dll, and
# libwinpthread-1.dll when -lpthread pulls it in), so its Package step SHIPS
# them beside the exe: Windows searches the exe's own folder first, so the
# zip is still self-contained. Its DLL gate is the INVERSE of the static
# job's: every import must be either a known Windows system DLL or a
# toolchain DLL that was copied into pkg/ - anything else (a vendored dep
# that went dynamic, e.g. SDL3.dll) FAILS the job. Object code is identical
# to the static job (only link flags differ), so both Windows jobs share the
# ccache-windows-x64- restore prefix and warm-start each other's caches.
# Verified locally 2026-10-18 (gcc-mingw-w64-x86-64 14.2, debian trixie):
# the dynamic exe imports exactly libgcc_s_seh-1 + libstdc++-6 (+ libssp-0
# when -fstack-protector-strong is on); all three ship in the
# gcc-mingw-w64-*-posix-runtime / mingw-w64-x86-64-dev packages, and
# `x86_64-w64-mingw32-g++ -print-file-name=<dll>` resolves each one.
# 2026-10-18 first CI run: the allowlist needed HID.DLL (SDL3/hidapi gamepad
# input) and MSWSOCK.dll (Winsock2 extension provider reached via ws2_32).
# Both are OS components in System32 on every clean Windows install, so the
# gate's system-DLL list gained them instead of the gate being skipped - it
# still catches vendored deps going dynamic (the bug it was built for).
# 2026-10-18 (GPU_SCALER_SHARED): the nonstatic job also builds libslang-vk
# as a shared library (-DGPU_SCALER_SHARED=ON): the exe imports
# libslangvk.dll from the FetchContent build tree, the Package step copies it
# into pkg/ beside the exe, and the gate scans BOTH import tables (the DLL
# needs the same MinGW runtime DLLs the exe needs). The static slang variant
# the other jobs use is untouched (fork CMakeLists GPU_SCALER_SHARED default
# OFF).
# LINUX-NONSTATIC JOB (2026-10-18): the mirror of the windows/
# windows-nonstatic pair on Linux: the same gcc:14-bookworm build as the
# `linux` job but WITHOUT -static-libgcc/-static-libstdc++ and WITH
# -DGPU_SCALER_SHARED=ON, so the exe imports libslangvk.so from the
# FetchContent build tree and the zip ships it beside the exe together
# with the image's GCC 14 libstdc++.so.6/libgcc_s.so.1 (Debian 12's stock
# copies are too old for this C++23 tree). Linux does not search the exe's
# own folder for shared objects (Windows does) and DT_RUNPATH is not
# inherited transitively, so GPU_SCALER_SHARED also wires $ORIGIN into the
# build RUNPATH of the exe AND the .so (CMakeLists.txt CMAKE_BUILD_RPATH);
# the job's RUNPATH gate fails if that wiring is ever lost. The static
# job's GLIBC 2.36 portability gate is kept (now covering the .so too);
# its GLIBCXX absence check is inverted (the dynamic build REQUIRES
# GLIBCXX_ from the shipped libstdc++).
name: GPU Shader Scalers (Windows + Linux)

on:
  push:
    # Docs/markdown-only commits cannot change a binary; don't burn a full
    # vendored-dep build on them.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 (SDL3 + GPU shader scaler, glibc 2.36 floor)
    runs-on: ubuntu-24.04
    # MAINT-04: attaching the built zips to the published GitHub Release needs
    # contents:write on the default GITHUB_TOKEN.
    permissions:
      contents: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: time_macros,pch_defines
    container:
      # Debian 12 bookworm BASE (glibc 2.36 = the artifact's floor) + GCC 14 in
      # /usr/local. Plain debian:bookworm ships GCC 12, which has no C++23 <format>
      # and cannot compile this tree; GCC 13+ is not in the bookworm repos either.
      # The -static-libstdc++ link below keeps the artifact runnable against Debian
      # 12's stock GCC-12 libstdc++ (GLIBCXX_3.4.30).
      image: gcc:14-bookworm
    steps:
    - name: Bootstrap container (git for actions/checkout)
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git ca-certificates
        # CMake's get_git_commit_hash() runs `git log` inside the workspace. In
        # container jobs the checkout dir is owned by the runner user while the
        # steps run as root, so git refuses with "dubious ownership" and the exe
        # silently builds WITHOUT the commit in its version string (the
        # field-reported "Linux title footer has no commit").
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-linux-x64-${{ github.sha }}
        restore-keys: |
          ccache-linux-x64-

    - name: Install dependencies
      run: |
        # The lib*-dev stack is required by the VENDORED SDL3's X11/Wayland/audio
        # backends. Without it, configure aborts with:
        #   "Couldn't find dependency package for XCURSOR"
        # binutils = objdump for the portability gate below.
        # ccache: compiler cache across pushes (the vendored dep tree is rebuilt
        #   from source every configure; only real source changes should recompile).
        # (no g++ here on purpose: the image's GCC 14 in /usr/local IS the toolchain;
        #  installing bookworm's g++ would put a second, older compiler on disk)
        # (no glslang-tools: the slang stack ships inside the libslang-vk
        #  library, which fetches and builds its own glslang via FetchContent)
        apt-get install -y --no-install-recommends ninja-build gettext smpq zip patch cmake binutils ccache \
          libasound2-dev libpulse-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
          libxtst-dev \
          libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
          libudev-dev libdbus-1-dev \
          libbz2-dev libpng-dev
        # toolchain sanity in the log: must resolve /usr/local/bin/g++ (GCC 14),
        # NOT /usr/bin/c++ (bookworm's GCC 12, no <format>)
        g++ --version | head -1

    # gcc/g++ pinned explicitly: PATH resolves /usr/local/bin (GCC 14 from the image);
    # without pins CMake could probe /usr/bin/c++ = bookworm's GCC 12 (no <format>).
    # GIT_COMMIT_HASH pin: GITHUB_SHA is authoritative even if the in-container git
    # state is unusable (see Bootstrap). shell: bash is REQUIRED — container steps run
    # under sh (dash) by default and dash rejects the ${GITHUB_SHA:0:7} substring
    # expansion ("Bad substitution"); every other step here is POSIX-clean on purpose.
    # NOTE: no '#' comments inside the folded command — YAML joins it into one line.
    - name: Configure (GCC 14 from /usr/local, bookworm glibc 2.36 base)
      shell: bash
      run: >
        cmake -S. -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DUSE_SDL3=ON
        -DUSE_GPU_SCALER=ON
        -DDEVILUTIONX_SYSTEM_SDL3=OFF
        -DDEVILUTIONX_SYSTEM_LIBSODIUM=OFF
        -DBUILD_TESTING=OFF
        -DDEVILUTIONX_SYSTEM_GOOGLETEST=OFF
        -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DGIT_COMMIT_HASH=${GITHUB_SHA:0:7}
        -DCMAKE_C_FLAGS='-ffunction-sections -fdata-sections'
        -DCMAKE_CXX_FLAGS='-ffunction-sections -fdata-sections'
        -DCMAKE_EXE_LINKER_FLAGS='-static-libgcc -static-libstdc++ -Wl,--gc-sections'

    - name: Build
      run: cmake --build build -j $(getconf _NPROCESSORS_ONLN)

    - name: Portability gate (glibc 2.36 floor — mirror of the Windows DLL gate)
      run: |
        # 1) static libstdc++/libgcc: NO GLIBCXX_/CXXABI_ symbol versions may remain
        if objdump -T build/devilutionx | grep -qE 'GLIBCXX_|CXXABI_'; then
          echo '::error::devilutionx still requires libstdc++ symbol versions - the -static-libstdc++ linker flag was lost. Debian 12 would reject this binary (GLIBCXX_3.4.31 not found).'
          exit 1
        fi
        # 2) max GLIBC_ requirement must be <= 2.36 (bookworm base of the gcc:14 image)
        MAX_GLIBC=$(objdump -T build/devilutionx | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
        echo "max GLIBC_ symbol requirement: ${MAX_GLIBC#GLIBC_} (floor: 2.36)"
        if [ "$(printf '%s\n2.36\n' "${MAX_GLIBC#GLIBC_}" | sort -V | tail -1)" != "2.36" ]; then
          echo '::error::devilutionx requires a GLIBC newer than 2.36 - the bookworm build base was lost. Debian 12 would reject this binary.'
          exit 1
        fi
        # 3) smoke test: the loader resolves every DT_NEEDED / symbol version exactly
        #    as it did on the field-reported Debian 12 failure; --version exits cleanly.
        ./build/devilutionx --version
        # 4) the version string must carry the git commit: the title-screen footer
        #    and gpu-scaler.log session headers identify the build with it.
        VER=$(./build/devilutionx --version 2>&1)
        echo "embedded version: ${VER}"
        if ! printf '%s' "${VER}" | grep -qE '[0-9a-f]{7}'; then
          echo '::error::devilutionx --version carries no git commit - GIT_COMMIT_HASH was not embedded (title footer and gpu-scaler.log cannot identify this build).'
          exit 1
        fi

    - name: Package
      run: |
        # size telemetry (permanent): exe bytes + per-section breakdown land in
        # the CI log on every build, so size levers are judged with data.
        ls -l build/devilutionx
        size -A build/devilutionx | head -30
        mkdir -p pkg
        cp build/devilutionx pkg/
        if [ -f build/devilutionx.mpq ]; then cp build/devilutionx.mpq pkg/; fi
        # Hellfire: ship the expansion MPQ the build produces (BUILD_ASSETS_MPQ
        # + smpq). Without it the zip cannot run Hellfire even for users who own it.
        if [ -f build/mods/hf.mpq ]; then
          mkdir -p pkg/mods
          cp build/mods/hf.mpq pkg/mods/
        fi
        # shader helper scripts ship beside the binary (corpus download / cache wipe)
        install -m 0755 Packaging/linux/install_shaders.sh Packaging/linux/clear_shader_cache.sh pkg/
        cp Packaging/resources/COPYING.legend.txt pkg/ 2>/dev/null || true
        cat > pkg/LINUX-REQUIREMENTS.txt <<'EOT'
        devilutionx (GPU shader scaler build) - Linux x86_64
        Built on gcc:14-bookworm (Debian 12 base, glibc 2.36); static libstdc++/libgcc; SDL3 vendored/static.

        Requires:
          glibc >= 2.36            Debian 12+, Ubuntu 24.04+, Fedora 38+, Arch current
          libvulkan.so.1           (e.g. Debian/Ubuntu: mesa-vulkan-drivers or the NVIDIA driver)
          X11 or Wayland session   SDL3 backends load at runtime
        Older glibc systems (Ubuntu 22.04, Debian 11): build from source with the
        CMake line in .github/workflows/gpu-shaders.yml (Linux job).
        EOT
        cd pkg && zip -r ../devilutionx-gpu-shaders-linux-x64.zip . && cd ..

    - name: Upload Linux package
      uses: actions/upload-artifact@v4
      with:
        name: devilutionx-gpu-shaders-linux-x64
        path: devilutionx-gpu-shaders-linux-x64.zip

    # MAINT-04: release builds must land on the release page, not only in
    # 90-day workflow artifacts. Attaches the same zips staged above to the
    # GitHub Release that triggered the run; skipped for push/dispatch runs.
    - name: Attach builds to the GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          devilutionx-gpu-shaders-linux-x64.zip

  linux-tests:
    name: Linux x86_64 (gtest suite)
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: time_macros,pch_defines
    container:
      # Same image as the build job: same toolchain, same glibc, and identical
      # compile flags (see Configure) so the shared ccache entries stay valid
      # for both jobs.
      image: gcc:14-bookworm
    # No permissions block and no contents:write — this job ships nothing;
    # it only runs ctest.
    steps:
    - name: Bootstrap container (git for actions/checkout)
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git ca-certificates
        # Same dubious-ownership fix as the build job: CMake still calls git
        # during configure (get_git_commit_hash()).
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-linux-tests-x64-${{ github.sha }}
        # Shared prefix with the build job: this job warm-starts from either
        # Linux job's cache of a previous run (identical compile flags make
        # the entries valid for both).
        restore-keys: |
          ccache-linux-

    - name: Install dependencies
      run: |
        # Same vendored-SDL3 dev stack as the build job (the X11/Wayland/audio
        # backends are required to configure; the suite links the same SDL3).
        # No GPU stack: the preset runtime harnesses (preset_unload and
        # friends) retired with the in-house slang runner - preset chain
        # semantics are exercised by libslang-vk's own CI (corpus sweep,
        # golden images, sanitizers on lavapipe), and the scaler adapter has
        # no headless harness of its own yet.
        apt-get install -y --no-install-recommends ninja-build gettext smpq zip patch cmake ccache \
          libasound2-dev libpulse-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
          libxtst-dev \
          libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
          libudev-dev libdbus-1-dev \
          libbz2-dev libpng-dev
        # toolchain sanity in the log: must resolve /usr/local/bin/g++ (GCC 14)
        g++ --version | head -1

    # Identical flags to the build job's Configure except BUILD_TESTING=ON —
    # identical flags are what make the shared ccache entries valid for both
    # jobs. GCC 14 pin + GIT_COMMIT_HASH pin + shell: bash: same reasons as the
    # build job (container steps default to dash, which rejects ${GITHUB_SHA:0:7}).
    - name: Configure (GCC 14, BUILD_TESTING=ON — mirrors the build job)
      shell: bash
      run: >
        cmake -S. -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DUSE_SDL3=ON
        -DUSE_GPU_SCALER=ON
        -DDEVILUTIONX_SYSTEM_SDL3=OFF
        -DDEVILUTIONX_SYSTEM_LIBSODIUM=OFF
        -DBUILD_TESTING=ON
        -DDEVILUTIONX_SYSTEM_GOOGLETEST=OFF
        -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DGIT_COMMIT_HASH=${GITHUB_SHA:0:7}
        -DCMAKE_C_FLAGS='-ffunction-sections -fdata-sections'
        -DCMAKE_CXX_FLAGS='-ffunction-sections -fdata-sections'
        -DCMAKE_EXE_LINKER_FLAGS='-static-libgcc -static-libstdc++ -Wl,--gc-sections'

    - name: Build
      run: cmake --build build -j $(getconf _NPROCESSORS_ONLN)

    - name: Test (gtest suite)
      run: |
        ctest --test-dir build --output-on-failure -j $(getconf _NPROCESSORS_ONLN)

  # Mirror of the `linux` job with dynamic linking - the Linux counterpart of
  # the windows/windows-nonstatic pair (see the WINDOWS-NONSTATIC JOB note at
  # the top):
  #   - GPU_SCALER_SHARED=ON: libslang-vk also builds its slangvk::shared
  #     variant and the exe links it as libslangvk.so; the Package step ships
  #     it beside the exe.
  #   - No -static-libgcc/-static-libstdc++: exe and libslangvk.so share ONE
  #     dynamic C++ runtime (GCC 14's libstdc++.so.6 from the build image).
  #     Debian 12's stock libstdc++ (GCC 12, GLIBCXX_3.4.30) is too old for
  #     this C++23 tree, so the zip SHIPS the image's libstdc++.so.6 +
  #     libgcc_s.so.1 beside the exe - the same trick the Windows nonstatic
  #     job uses for the MinGW runtime DLLs. Linux does NOT search the exe's
  #     own folder for shared objects (Windows does), and DT_RUNPATH is not
  #     inherited transitively, so GPU_SCALER_SHARED also wires $ORIGIN into
  #     the build RUNPATH of BOTH the exe and libslangvk.so (CMakeLists.txt,
  #     CMAKE_BUILD_RPATH); the RUNPATH gate below fails the job if that
  #     wiring is ever lost.
  #   - glibc is NEVER shipped (NSS/loader compatibility). The static job's
  #     GLIBC <= 2.36 gate still applies, now to the exe AND the .so.
  #   - SDL3/SDL3_image/zlib/libpng stay vendored static (bookworm has no
  #     SDL3 packages); bzip2 stays system-dynamic exactly as in the static
  #     job (DEVILUTIONX_SYSTEM_BZIP2 default ON; libbz2.so.1.0 is universal).
  # Object code is identical to the `linux` job except the slang/scaler TUs
  # (SLANGVK_SHARED + PIC change their defines), so the shared
  # ccache-linux-x64- restore prefix warm-starts this job from the static
  # job's cache; the primary key's -nonstatic- infix keeps the saved entries
  # distinct (same pattern as the Windows pair).
  linux-nonstatic:
    name: Linux x86_64 (SDL3 + GPU shader scaler, dynamic link - ships libslangvk.so + GCC 14 runtime)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: time_macros,pch_defines
    container:
      # Same image as the static Linux job (Debian 12 base, glibc 2.36 floor,
      # GCC 14 in /usr/local): see the `linux` job for the full rationale.
      image: gcc:14-bookworm
    steps:
    - name: Bootstrap container (git for actions/checkout)
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git ca-certificates
        # Same dubious-ownership fix as the build job: CMake still calls git
        # during configure (get_git_commit_hash()).
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Object code is identical to the `linux` job except the slang/scaler
    # TUs, so the shared ccache-linux-x64- prefix warm-starts from the static
    # job's cache of the same push (same pattern as the Windows pair). The
    # primary key's -nonstatic- infix keeps the saved entries distinct.
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-linux-x64-nonstatic-${{ github.sha }}
        restore-keys: |
          ccache-linux-x64-

    - name: Install dependencies
      run: |
        # Same vendored-SDL3 dev stack as the static Linux job (the
        # X11/Wayland/audio backends are required to configure; SDL3 itself
        # stays vendored/static - bookworm has no SDL3 packages).
        # binutils = objdump for the gates below.
        apt-get install -y --no-install-recommends ninja-build gettext smpq zip patch cmake binutils ccache \
          libasound2-dev libpulse-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
          libxtst-dev \
          libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
          libudev-dev libdbus-1-dev \
          libbz2-dev libpng-dev
        # toolchain sanity in the log: must resolve /usr/local/bin/g++ (GCC 14)
        g++ --version | head -1

    # Identical to the `linux` job's Configure except: GPU_SCALER_SHARED=ON
    # (build + link libslangvk.so) and CMAKE_EXE_LINKER_FLAGS drops
    # -static-libgcc/-static-libstdc++ (the shipped libstdc++.so.6 below is
    # now the shared C++ runtime for exe and .so alike). shell: bash is
    # REQUIRED for the ${GITHUB_SHA:0:7} expansion (container steps run under
    # dash by default); the Package step stays POSIX-clean like the static
    # job's.
    - name: Configure (same flags as the linux job, minus -static-*, plus GPU_SCALER_SHARED)
      shell: bash
      run: >
        cmake -S. -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DUSE_SDL3=ON
        -DUSE_GPU_SCALER=ON
        -DGPU_SCALER_SHARED=ON
        -DDEVILUTIONX_SYSTEM_SDL3=OFF
        -DDEVILUTIONX_SYSTEM_LIBSODIUM=OFF
        -DBUILD_TESTING=OFF
        -DDEVILUTIONX_SYSTEM_GOOGLETEST=OFF
        -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DGIT_COMMIT_HASH=${GITHUB_SHA:0:7}
        -DCMAKE_C_FLAGS='-ffunction-sections -fdata-sections'
        -DCMAKE_CXX_FLAGS='-ffunction-sections -fdata-sections'
        -DCMAKE_EXE_LINKER_FLAGS='-Wl,--gc-sections'

    - name: Build
      run: cmake --build build -j $(getconf _NPROCESSORS_ONLN)

    - name: Package
      run: |
        # size telemetry (permanent): exe bytes + per-section breakdown land in
        # the CI log on every build, so size levers are judged with data.
        ls -l build/devilutionx
        size -A build/devilutionx | head -30
        mkdir -p pkg
        cp build/devilutionx pkg/
        if [ -f build/devilutionx.mpq ]; then cp build/devilutionx.mpq pkg/; fi
        # Hellfire: ship the expansion MPQ the build produces (BUILD_ASSETS_MPQ
        # + smpq). Without it the zip cannot run Hellfire even for users who own it.
        if [ -f build/mods/hf.mpq ]; then
          mkdir -p pkg/mods
          cp build/mods/hf.mpq pkg/mods/
        fi
        # shader helper scripts ship beside the binary (corpus download / cache wipe)
        install -m 0755 Packaging/linux/install_shaders.sh Packaging/linux/clear_shader_cache.sh pkg/
        cp Packaging/resources/COPYING.legend.txt pkg/ 2>/dev/null || true

        # libslang-vk ships as a shared object beside the exe
        # (GPU_SCALER_SHARED=ON), mirroring the Windows nonstatic job's
        # libslangvk.dll.
        slangvk_so="$(find build -name libslangvk.so -print -quit)"
        if [ -z "$slangvk_so" ]; then
          echo '::error::libslangvk.so not found in the build tree - GPU_SCALER_SHARED=ON did not build the shared variant.'
          exit 1
        fi
        cp "$slangvk_so" pkg/

        # Ship the GCC 14 C++ runtime the exe and the .so both need: Debian 12
        # ships GCC 12's libstdc++ (GLIBCXX_3.4.30) and this C++23 tree needs
        # newer versions. Same pattern as the Windows nonstatic job shipping
        # the MinGW runtime DLLs. Prefer the image's copies under /usr/local
        # (GCC 14) over the base distro's; -L dereferences the soname symlinks.
        for lib in libstdc++.so.6 libgcc_s.so.1; do
          src="$(find /usr/local/lib64 /usr/local/lib -maxdepth 1 -name "$lib" -print -quit 2>/dev/null || true)"
          if [ -z "$src" ]; then
            echo "::error::$lib not found under /usr/local - expected the gcc:14 image's C++ runtime there."
            exit 1
          fi
          cp -L "$src" "pkg/$lib"
          echo "shipped C++ runtime: $lib <- $(readlink -f "$src")"
        done

        # GATE 1 - RUNPATH wiring (Linux's substitute for Windows' exe-folder
        # search): the exe AND libslangvk.so must carry $ORIGIN, or the shipped
        # libs above are ignored on a user's machine. DT_RUNPATH is not
        # inherited transitively, so the .so needs its own entry for its own
        # libstdc++/libgcc dependencies. (Wired by CMAKE_BUILD_RPATH under
        # GPU_SCALER_SHARED in CMakeLists.txt.)
        for bin in build/devilutionx "$slangvk_so"; do
          if ! objdump -x "$bin" | grep -E 'RPATH|RUNPATH' | grep -q '\$ORIGIN'; then
            echo "::error::$bin has no \$ORIGIN in RPATH/RUNPATH - the GPU_SCALER_SHARED RPATH wiring (CMAKE_BUILD_RPATH in CMakeLists.txt) was lost. The package would not launch on a user's machine."
            exit 1
          fi
        done
        objdump -x build/devilutionx | grep -E 'RPATH|RUNPATH' | head -2

        # GATE 2 - inverse of the static job's portability gate: this build is
        # SUPPOSED to be dynamic. The exe must require GLIBCXX_/CXXABI_ (from
        # the shipped libstdc++) and must import libslangvk.so directly.
        if ! objdump -T build/devilutionx | grep -qE 'GLIBCXX_|CXXABI_'; then
          echo '::error::devilutionx has no GLIBCXX_/CXXABI_ requirements - the -static-libstdc++ linker flag is still on; this is not the dynamic build.'
          exit 1
        fi
        if ! objdump -p build/devilutionx | grep NEEDED | grep -q libslangvk.so; then
          echo '::error::devilutionx does not import libslangvk.so - GPU_SCALER_SHARED=ON was lost and the slang stack is embedded statically again.'
          exit 1
        fi

        # GATE 3 - glibc floor unchanged (2.36): now enforced for the exe AND
        # libslangvk.so (glibc itself is never shipped).
        for bin in build/devilutionx "$slangvk_so"; do
          MAX_GLIBC=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "max GLIBC_ of $(basename "$bin"): ${MAX_GLIBC#GLIBC_} (floor: 2.36)"
          if [ "$(printf '%s\n2.36\n' "${MAX_GLIBC#GLIBC_}" | sort -V | tail -1)" != "2.36" ]; then
            echo "::error::$(basename "$bin") requires a GLIBC newer than 2.36 - the bookworm build base was lost. Debian 12 would reject this binary."
            exit 1
          fi
        done

        # The shipped libstdc++ must actually PROVIDE the newest GLIBCXX the
        # exe requires (guards against a wrong/older copy sneaking in).
        NEED_GLIBCXX=$(objdump -T build/devilutionx | grep -o 'GLIBCXX_[0-9.]*' | sort -Vu | tail -1)
        echo "exe requires ${NEED_GLIBCXX}; shipped libstdc++ must provide it"
        if ! objdump -p pkg/libstdc++.so.6 | grep -q "$NEED_GLIBCXX"; then
          echo "::error::shipped libstdc++.so.6 does not provide ${NEED_GLIBCXX} - the wrong C++ runtime was copied into pkg/."
          exit 1
        fi

        # GATE 4 - self-containment (the Linux mirror of the Windows DLL
        # gate): with pkg/ on the library path, ldd must resolve EVERY
        # dependency of the exe and the .so. Everything resolved from pkg/ is
        # shipped; system resolutions are allowed only for the glibc family
        # and libbz2 (DEVILUTIONX_SYSTEM_BZIP2 stays ON, and libbz2.so.1.0 is
        # universal on desktop distros). Anything else FAILS: the zip would
        # not launch on a clean Debian 12.
        fail=0
        for bin in pkg/devilutionx pkg/libslangvk.so; do
          echo "== ldd $(basename "$bin") =="
          LD_LIBRARY_PATH="$PWD/pkg" ldd "$bin" > ldd_out.txt 2>&1 || true
          cat ldd_out.txt
          while IFS= read -r line; do
            case "$line" in
              *"not found"*)
                echo "::error::unresolved dependency in $(basename "$bin"): $line"
                fail=1
                continue ;;
            esac
            path="$(printf '%s' "$line" | awk '/=> \// {print $3}')"
            if [ -z "$path" ]; then continue; fi
            case "$path" in
              "$PWD"/pkg/*)
                echo "  -> shipped: $(basename "$path")" ;;
              *)
                base="$(basename "$path")"
                case "$base" in
                  ld-linux*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libresolv.so*|libbz2.so*)
                    echo "  -> system (universal, not shipped): $base" ;;
                  *)
                    echo "::error::$(basename "$bin") needs system lib $base which the package does not ship and the allowlist does not cover. Either ship it beside the exe (like libstdc++/libgcc above) or extend the allowlist with justification."
                    fail=1 ;;
                esac ;;
            esac
          done < ldd_out.txt
        done
        if [ "$fail" -ne 0 ]; then
          echo '::error::package is not self-contained - the zip would not launch on a clean Debian 12 install.'
          exit 1
        fi

        # smoke test with ONLY the shipped libs: the exe's $ORIGIN RUNPATH
        # resolves libslangvk.so + the C++ runtime from pkg/ exactly as it
        # would on a user's machine.
        ./pkg/devilutionx --version
        VER=$(./pkg/devilutionx --version 2>&1)
        echo "embedded version: ${VER}"
        if ! printf '%s' "${VER}" | grep -qE '[0-9a-f]{7}'; then
          echo '::error::devilutionx --version carries no git commit - GIT_COMMIT_HASH was not embedded (title footer and gpu-scaler.log cannot identify this build).'
          exit 1
        fi

        ls -l pkg/
        cat > pkg/LINUX-REQUIREMENTS.txt <<'EOT'
        devilutionx (GPU shader scaler build, dynamic link) - Linux x86_64
        Built on gcc:14-bookworm (Debian 12 base, glibc 2.36). Dynamically
        linked: this zip ships libslangvk.so (libslang-vk: slang/glslang) and
        the GCC 14 C++ runtime (libstdc++.so.6, libgcc_s.so.1) beside the exe;
        SDL3 is vendored/static.

        Requires:
          glibc >= 2.36            Debian 12+, Ubuntu 24.04+, Fedora 38+, Arch current
          libvulkan.so.1           (e.g. Debian/Ubuntu: mesa-vulkan-drivers or the NVIDIA driver)
          libbz2.so.1.0            present on every mainstream desktop distro
          X11 or Wayland session   SDL3 backends load at runtime
        Keep devilutionx, libslangvk.so, libstdc++.so.6 and libgcc_s.so.1 in
        the SAME folder: the exe and the .so resolve them via their $ORIGIN
        RUNPATH (Linux does not search the exe's folder by default).
        EOT
        cd pkg && zip -r ../devilutionx-gpu-shaders-linux-x64-nonstatic.zip . && cd ..

    - name: Upload Linux package (nonstatic)
      uses: actions/upload-artifact@v4
      with:
        name: devilutionx-gpu-shaders-linux-x64-nonstatic
        path: devilutionx-gpu-shaders-linux-x64-nonstatic.zip

    # MAINT-04: attach the nonstatic Linux zip to the release that triggered
    # the run (same flow as the other jobs).
    - name: Attach build to the GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: devilutionx-gpu-shaders-linux-x64-nonstatic.zip

  windows:
    name: Windows x64 (MinGW cross, SDL3, fully static — launches without extra DLLs)
    runs-on: ubuntu-24.04
    # MAINT-04: see the Linux job — release uploads need contents:write.
    permissions:
      contents: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: time_macros,pch_defines
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-windows-x64-${{ github.sha }}
        restore-keys: |
          ccache-windows-x64-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 gettext smpq zip patch ccache

    # Configure (exact flags of the verified local build). GIT_COMMIT_HASH is NOT
    # pinned here on purpose: the VM checkout's git works (no container ownership
    # issue), so CMake falls back to `git log -1 --format=%h` and the footer carries
    # the hash. (The ${GITHUB_SHA:0:7} bashism from round 6 is a no-op under pwsh —
    # removed; only the Linux container needs the explicit pin + shell: bash.)
    #
    # Windows: size lever REVERTED (measured +1.27 MB, see header note).
    # Keep the two flag lines below exactly as the verified zero-DLL build had them.
    # NOTE: no '#' comments inside the folded command — YAML folds them into the
    # shell line where '#' starts a comment and silently truncates every argument
    # after it (this exact bug once dropped -DCMAKE_EXE_LINKER_FLAGS and the
    # -static link with it; the DLL gate caught it).
    - name: Configure (exact flags of the verified local build)
      run: >
        cmake -S. -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/CMake/platforms/mingwcc64.toolchain.cmake
        -DCROSS_PREFIX=/usr
        -DUSE_SDL3=ON
        -DUSE_GPU_SCALER=ON
        -DDEVILUTIONX_SYSTEM_SDL3=OFF
        -DDEVILUTIONX_SYSTEM_LIBSODIUM=OFF
        -DDEVILUTIONX_SYSTEM_ZLIB=OFF
        -DDEVILUTIONX_SYSTEM_BZIP2=OFF
        -DDEVILUTIONX_SYSTEM_LIBPNG=OFF
        -DBUILD_TESTING=OFF
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_C_FLAGS='-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
        -DCMAKE_EXE_LINKER_FLAGS='-static -static-libgcc -static-libstdc++'

    - name: Build
      run: cmake --build build -j $(getconf _NPROCESSORS_ONLN)

    - name: Package
      run: |
        # size telemetry (permanent): exe bytes + per-section breakdown land in
        # the CI log on every build, so size levers are judged with data.
        ls -l build/devilutionx.exe
        x86_64-w64-mingw32-size -A build/devilutionx.exe | head -30
        mkdir -p pkg
        cp build/devilutionx.exe pkg/
        if [ -f build/devilutionx.mpq ]; then cp build/devilutionx.mpq pkg/; fi
        # Hellfire: ship the expansion MPQ the build produces (BUILD_ASSETS_MPQ
        # + smpq). Without it the zip cannot run Hellfire even for users who own it.
        if [ -f build/mods/hf.mpq ]; then
          mkdir -p pkg/mods
          cp build/mods/hf.mpq pkg/mods/
        fi
        # shader helper scripts ship beside the exe (corpus download / cache wipe)
        cp Packaging/windows/install_shaders.cmd Packaging/windows/clear_shader_cache.cmd Packaging/windows/clear_gpu-scaler.log.cmd Packaging/windows/install_git.cmd pkg/
        # gate: the exe must stay fully static — Windows system DLLs ONLY.
        x86_64-w64-mingw32-objdump -p build/devilutionx.exe | grep 'DLL Name' | sort -u | tee dlls.txt
        if grep -qiE 'DLL Name:.*(libstdc|libgcc|libwinpthread|libssp|zlib1|liblzma|libpng|libjpeg|freetype|SDL)' dlls.txt; then
          echo '::error::devilutionx.exe links non-system DLLs — the -static linker flags were lost. This build would not launch on a clean Windows install.'
          exit 1
        fi
        cd pkg && zip -r ../devilutionx-gpu-shaders-windows-x64.zip . && cd ..

    - name: Upload Windows package
      uses: actions/upload-artifact@v4
      with:
        name: devilutionx-gpu-shaders-windows-x64
        path: devilutionx-gpu-shaders-windows-x64.zip

    # MAINT-04: attach the Windows zip to the release that triggered the run.
    - name: Attach build to the GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: devilutionx-gpu-shaders-windows-x64.zip

  # Same MinGW cross build as the `windows` job but with NO -static linker
  # flags (see the WINDOWS-NONSTATIC JOB header note at the top). Everything
  # else is deliberately identical: the vendored deps stay static EXCEPT
  # libslang-vk (-DGPU_SCALER_SHARED=ON), which ships as libslangvk.dll
  # beside the exe; the remaining new imports are the MinGW runtime DLLs,
  # which the Package step resolves from the cross toolchain and ships too.
  windows-nonstatic:
    name: Windows x64 (MinGW cross, SDL3, dynamic link — ships MinGW runtime DLLs)
    runs-on: ubuntu-24.04
    # MAINT-04: see the Linux job — release uploads need contents:write.
    permissions:
      contents: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: time_macros,pch_defines
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Object code is identical to the static job (only link flags differ), so
    # the shared ccache-windows-x64- prefix warm-starts this job from the
    # static job's cache of the same push. The primary key has its own
    # -nonstatic- infix so this job saves under a distinct key and the two
    # jobs never race for the same cache entry.
    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-windows-x64-nonstatic-${{ github.sha }}
        restore-keys: |
          ccache-windows-x64-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 gettext smpq zip patch ccache

    # Identical to the static job's Configure except CMAKE_EXE_LINKER_FLAGS:
    # no -static, no -static-libgcc, no -static-libstdc++, plus
    # GPU_SCALER_SHARED=ON: libslang-vk also builds its slangvk::shared
    # variant and the exe links that (libslangvk.dll beside the exe) instead
    # of the static embed. Nothing else adds static linkage: the toolchain
    # file (CMake/platforms/mingwcc64.toolchain.cmake) carries none, and
    # DEVILUTIONX_STATIC_CXX_STDLIB (the genex that would add
    # -static-libgcc/-static-libstdc++ per library) is force-disabled when sound
    # is on and sdl_audiolib is not static (CMakeLists.txt "Mixing
    # -static-libstdc++ with a dynamic C++ dependency" guard).
    # NOTE: no '#' comments inside the folded command — YAML folds them into the
    # shell line where '#' starts a comment and silently truncates every argument
    # after it.
    - name: Configure (same flags as the static job, minus -static)
      run: >
        cmake -S. -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/CMake/platforms/mingwcc64.toolchain.cmake
        -DCROSS_PREFIX=/usr
        -DUSE_SDL3=ON
        -DUSE_GPU_SCALER=ON
        -DGPU_SCALER_SHARED=ON
        -DDEVILUTIONX_SYSTEM_SDL3=OFF
        -DDEVILUTIONX_SYSTEM_LIBSODIUM=OFF
        -DDEVILUTIONX_SYSTEM_ZLIB=OFF
        -DDEVILUTIONX_SYSTEM_BZIP2=OFF
        -DDEVILUTIONX_SYSTEM_LIBPNG=OFF
        -DBUILD_TESTING=OFF
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_C_FLAGS='-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion'

    - name: Build
      run: cmake --build build -j $(getconf _NPROCESSORS_ONLN)

    - name: Package
      run: |
        # size telemetry (permanent): exe bytes + per-section breakdown land in
        # the CI log on every build, so size levers are judged with data.
        ls -l build/devilutionx.exe
        x86_64-w64-mingw32-size -A build/devilutionx.exe | head -30
        mkdir -p pkg
        cp build/devilutionx.exe pkg/
        if [ -f build/devilutionx.mpq ]; then cp build/devilutionx.mpq pkg/; fi
        # Hellfire: ship the expansion MPQ the build produces (BUILD_ASSETS_MPQ
        # + smpq). Without it the zip cannot run Hellfire even for users who own it.
        if [ -f build/mods/hf.mpq ]; then
          mkdir -p pkg/mods
          cp build/mods/hf.mpq pkg/mods/
        fi
        # shader helper scripts ship beside the exe (corpus download / cache wipe)
        cp Packaging/windows/install_shaders.cmd Packaging/windows/clear_shader_cache.cmd Packaging/windows/clear_gpu-scaler.log.cmd Packaging/windows/install_git.cmd pkg/
        # INVERSE of the static job's DLL gate: the dynamic exe imports the
        # MinGW runtime DLLs, so every NON-SYSTEM import must ship beside the
        # exe (Windows searches the exe's own folder first, keeping the zip
        # self-contained). libslang-vk ships as a DLL in this job
        # (GPU_SCALER_SHARED=ON): copy libslangvk.dll out of the FetchContent
        # build tree into pkg/ and gate its OWN import table too - it needs
        # the same MinGW runtime DLLs the exe needs, and a regression there
        # must fail here instead of on a user's machine. Each import must be:
        #   1. a known Windows system DLL / API set  -> ok, not shipped
        #   2. libslangvk.dll                        -> copied from the build tree above
        #   3. resolvable from the cross toolchain   -> copied into pkg/
        #   4. anything else (e.g. a vendored dep that went dynamic, SDL3.dll,
        #      zlib1.dll) -> FAIL, exactly what the static gate catches there.
        slangvk_dll="$(find build -name libslangvk.dll -print -quit)"
        {
          x86_64-w64-mingw32-objdump -p build/devilutionx.exe
          if [ -n "$slangvk_dll" ]; then
            cp "$slangvk_dll" pkg/
            x86_64-w64-mingw32-objdump -p "$slangvk_dll"
          fi
        } | grep 'DLL Name' | sed 's/.*DLL Name: //' | tr -d '\r' | sort -u > dlls.txt
        if [ ! -s dlls.txt ]; then
          echo '::error::no DLL imports parsed from devilutionx.exe - objdump output format changed?'
          exit 1
        fi
        cat dlls.txt
        resolve_dll() {
          name="$1"
          p="$(x86_64-w64-mingw32-g++ -print-file-name="$name" 2>/dev/null || true)"
          if [ -f "$p" ]; then printf '%s\n' "$p"; return 0; fi
          p="$(find /usr/lib/gcc/x86_64-w64-mingw32 /usr/x86_64-w64-mingw32/lib -maxdepth 3 -name "$name" -print -quit 2>/dev/null || true)"
          if [ -n "$p" ] && [ -f "$p" ]; then printf '%s\n' "$p"; return 0; fi
          return 1
        }
        fail=0
        while IFS= read -r imp; do
          name="$(printf '%s' "$imp" | tr '[:upper:]' '[:lower:]')"
          case "$name" in
            # Windows system DLLs / API sets: present on every Windows install.
            # hid.dll = HID client API (SDL3/hidapi imports it for gamepads);
            # mswsock.dll = Winsock2 extension provider (ConnectEx/AcceptEx),
            # pulled in through the ws2_32 chain. Both live in System32.
            api-ms-win-*|ext-ms-*|ntdll.dll|kernel32.dll|kernelbase.dll|user32.dll|gdi32.dll|gdi32full.dll|hid.dll|win32u.dll|shell32.dll|advapi32.dll|ole32.dll|oleaut32.dll|uuid.dll|ws2_32.dll|wsock32.dll|msvcrt.dll|mswsock.dll|ucrtbase.dll|vcruntime140*.dll|winmm.dll|imm32.dll|setupapi.dll|version.dll|dinput8.dll|xinput*.dll|shlwapi.dll|rpcrt4.dll|sechost.dll|bcrypt*.dll|userenv.dll|dbghelp.dll|d3d11.dll|dxgi.dll|opengl32.dll|glu32.dll|iphlpapi.dll|wintrust.dll|crypt32.dll|normaliz.dll|dnsapi.dll|cfgmgr32.dll|powrprof.dll|comctl32.dll|comdlg32.dll|uxtheme.dll|dwmapi.dll|msimg32.dll|shcore.dll)
              echo "system DLL (ok, not shipped): $imp" ;;
            # The slang DLL itself: copied from the build tree above (its own
            # import table is gated through the same objdump above).
            libslangvk.dll)
              echo "shipped libslang-vk DLL: $imp" ;;
            *)
              p="$(resolve_dll "$name" || true)"
              if [ -n "$p" ]; then
                cp "$p" pkg/
                echo "shipped toolchain DLL: $name <- $p"
              else
                echo "::error::$imp is imported but is neither a known Windows system DLL nor shipped by the cross toolchain. If this is a vendored dep that went dynamic (SDL/zlib/png/...), restore its static linkage; if it is a MinGW runtime DLL, fix resolve_dll above."
                fail=1
              fi ;;
          esac
        done < dlls.txt
        if [ "$fail" -ne 0 ]; then
          echo '::error::devilutionx.exe has imports that the package does not cover - the zip would not launch on a clean Windows install.'
          exit 1
        fi
        ls -l pkg/
        cd pkg && zip -r ../devilutionx-gpu-shaders-windows-x64-nonstatic.zip . && cd ..

    - name: Upload Windows package (nonstatic)
      uses: actions/upload-artifact@v4
      with:
        name: devilutionx-gpu-shaders-windows-x64-nonstatic
        path: devilutionx-gpu-shaders-windows-x64-nonstatic.zip

    # MAINT-04: attach the nonstatic zip to the release that triggered the run.
    - name: Attach build to the GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: devilutionx-gpu-shaders-windows-x64-nonstatic.zip
