# Fork-only CI: GPU shader scaler build gate (Windows x64 + Linux x64, SDL3).
#
# Why this file exists: after the merge-plan-r3 cleanup the fork carries
# upstream's own workflows, which only trigger on upstream's refs (push to
# master, PRs into diasurgical/DevilutionX) - so a push to a fork branch
# builds nothing. This workflow gives the fork branch a build gate without
# touching any PR content.
#
# MERGE-PLAN-R3 RULE (section 6.4): no CI yml ever rides the upstream PR.
# This file lives on fork-side branches only; the PR branch is cut fresh
# from diasurgical:master and must not contain it. Do not add it to the
# payload/overlay.
#
# Shape: Linux job is the upstream Linux_x86_64_SDL3_test.yml with
# -DUSE_GPU_SCALER=ON added. Windows job is the upstream Windows_MSVC_x64.yml
# (vcpkg manifest + CMakePresets) with the same SDL3/scaler flags plus vendored
# sodium (MSVC FindSodium cannot resolve vcpkg's import lib, see the configure
# step comment), an explicit MSVC dev environment (upstream gets one implicitly
# from lukka/run-cmake@v10, which this workflow bypasses to pass extra -D
# flags), and removal of vcpkg's SDL3 payload whose older headers shadow the
# FetchContent SDL 3.5.0 build (see the remove step comment). The scaler
# needs no Vulkan SDK at build time (libslang-vk loads the loader at runtime
# through volk) and fetches libslang-vk + glslang itself at configure time.
# USE_GPU_SCALER is passed explicitly even though it defaults ON for SDL3
# builds, so the gate cannot silently drift with the option default.
#
# Tests/artifacts: the Windows job configures with -DBUILD_TESTING=OFF (no
# gtest, no ~50 test executables, no ctest) because building the full test
# suite on the 2-core hosted Windows runner pushed the job past 30 minutes.
# Both jobs upload their build outputs as artifacts with if: always(), so a
# failed or cancelled run still yields the binaries for local debugging. The
# Linux job keeps ctest as the green regression signal; flip it off there the
# same way if it ever becomes the bottleneck.

name: GPU scaler build (fork-only)

on:
  push:
    branches:
      - master
      - libslang-vk
      - 'gpu-*'
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x64 (SDL3 + GPU scaler)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake curl g++-14 git libgtest-dev libgmock-dev libbenchmark-dev libsodium-dev libpng-dev libbz2-dev libasound2-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev wget

    - name: Switch to GCC 14
      run: |
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
        sudo update-alternatives --set gcc /usr/bin/gcc-14

    - name: Cache CMake build folder
      uses: actions/cache@v6
      with:
        path: build
        # github.repository (owner/name) is part of the runner workspace path
        # (/home/runner/work/<repo-name>/<repo-name>). Keying on it keeps the
        # cache key from ever matching an entry saved under a different repo
        # name: restoring a pre-rename build tree made cmake abort with
        # "The current CMakeCache.txt directory ... is different than the
        # directory ... where CMakeCache.txt was created". v7 marks the key
        # format change; the new prefix cannot match old v6 keys.
        key: ${{ github.workflow }}-${{ github.repository }}-linux-v7-${{ github.sha }}
        restore-keys: ${{ github.workflow }}-${{ github.repository }}-linux-v7-

    # Backstop for any workspace path change the key cannot see (repo renamed
    # again before the cache rolls over, runner image layout change): if the
    # restored build tree was configured under a different path, cmake cannot
    # reuse it, so discard it and let this run configure + save a fresh,
    # path-correct cache. No-op when the path matches (the normal case), so
    # incremental builds keep working.
    - name: Drop build tree generated under a different workspace path
      run: |
        if [ -f build/CMakeCache.txt ] && ! grep -aq "For build in directory: ${GITHUB_WORKSPACE}/build" build/CMakeCache.txt; then
          echo "build/CMakeCache.txt was generated under a different workspace path - discarding the restored build tree"
          rm -rf build
        fi

    # We specify `-DDEVILUTIONX_SYSTEM_BENCHMARK=OFF` to work around the following error:
    # lto1: fatal error: bytecode stream in file '/usr/lib/x86_64-linux-gnu/libbenchmark_main.a' generated with LTO version 11.2 instead of the expected 11.3
    - name: Configure (SDL3 + GPU scaler)
      run: |
        cmake -S. -Bbuild -G Ninja -DUSE_SDL3=ON -DUSE_GPU_SCALER=ON -DDEVILUTIONX_SYSTEM_SDL3=OFF -DDEVILUTIONX_SYSTEM_SDL_IMAGE=OFF -DDEVILUTIONX_STATIC_SDL3=ON -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF

    - name: Fetch test data
      run: |
        wget -qnc https://github.com/diasurgical/devilutionx-assets/releases/download/v2/spawn.mpq -P build

    - name: Build
      run: |
        cmake --build build -j $(nproc)

    - name: Binary smoke test
      run: |
        ./build/devilutionx --version

    - name: Run tests
      run: |
        cd build && ctest --output-on-failure

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: devilutionx-linux-x64-sdl3-gpu-scaler
        path: build/devilutionx
        if-no-files-found: warn
        retention-days: 7

  windows-x64:
    name: Windows x64 (SDL3 + GPU scaler)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Upstream's Windows_MSVC_x64.yml never puts cl.exe on PATH itself: it runs
    # everything through lukka/run-cmake@v10, which wraps the preset calls in
    # the `vcpkg env` MSVC environment on Windows. This workflow invokes cmake
    # directly (it needs extra -D flags run-cmake cannot pass), so without an
    # explicit dev prompt CMake silently falls back to the MinGW GCC that ships
    # on the runner image - the wrong compiler for the x64-windows (MSVC ABI)
    # triplet. Set the MSVC x64 environment for all subsequent steps instead.
    - name: Setup MSVC dev environment (x64)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Install latest CMake
      uses: lukka/get-cmake@latest

    - name: Restore or setup vcpkg
      uses: lukka/run-vcpkg@v11.6
      with:
        vcpkgGitCommitId: '40f3c709db80acf154ac4b17a1f83c564ebd022e'

    - name: Get CMakePresets.json
      run: cp Packaging/windows/CMakePresets.json .

    # Command-line -D flags override the preset's cacheVariables, so the
    # upstream SDL2 preset is reused as-is with SDL3 + the scaler switched on.
    # SDL3 and SDL3_image are built from source (FetchContent) exactly like
    # the Linux job; the vcpkg manifest keeps supplying the remaining deps
    # (and, unavoidably, an unused SDL3 copy that the next step removes).
    #
    # BUILD_TESTING=OFF skips gtest and the ~50 test executables (most of the
    # 1426 targets) plus ctest; spawn.mpq is not fetched since only tests used
    # it. Re-add -DBUILD_TESTING=ON + ctest when the build itself is trusted.
    #
    # sodium: the manifest's `encryption` feature does install libsodium
    # (that's why configure finds sodium.h), but DevilutionX's Findsodium.cmake
    # MSVC branch only knows the old prebuilt-libsodium layout
    # (x64/Release/v143/dynamic) and never resolves vcpkg's
    # installed/x64-windows/lib/libsodium.lib, so find_package(sodium REQUIRED)
    # dies with "Could NOT find sodium ... (found version ...)". Build the
    # project's own vendored sodium instead (3rdParty/libsodium ->
    # robinlinden/libsodium-cmake, SODIUM_MINIMAL) - the same
    # DEVILUTIONX_SYSTEM_LIBSODIUM=OFF knob upstream's Linux_x86_64/aarch64
    # CI jobs use. Static (DEVILUTIONX_STATIC_LIBSODIUM=ON) so no extra DLL
    # is needed beside devilutionx.exe for the smoke test.
    - name: Configure (SDL3 + GPU scaler)
      run: cmake --preset ninja-vcpkg-relwithdebinfo -DUSE_SDL3=ON -DUSE_GPU_SCALER=ON -DDEVILUTIONX_SYSTEM_SDL3=OFF -DDEVILUTIONX_SYSTEM_SDL_IMAGE=OFF -DDEVILUTIONX_SYSTEM_LIBSODIUM=OFF -DDEVILUTIONX_STATIC_LIBSODIUM=ON -DBUILD_TESTING=OFF

    # The manifest's `sdl3` feature also installs SDL3 (headers + config + libs)
    # into vcpkg_installed, and Dependencies.cmake's directory-scope
    # include_directories(${LUA_INCLUDE_DIR}) puts the vcpkg include root at the
    # FRONT of every target's include path - including the FetchContent'd
    # SDL3 3.5.0 subbuild. Its SDL_internal.h then picks up vcpkg's older
    # SDL3/SDL.h and the compile dies on version static-asserts and missing new
    # types (SDL_GamepadCapSenseType, SDL_FormFactor, ...). Nothing links
    # vcpkg's SDL3 (DEVILUTIONX_SYSTEM_SDL3=OFF), so remove its payload after
    # configure; the in-tree 3.5.0 headers become authoritative. vcpkg will not
    # reinstall them: the manifest is unchanged and its status file already
    # lists sdl3 as installed, so the next `vcpkg install` is a no-op.
    - name: Remove vcpkg SDL3 (older headers shadow FetchContent SDL 3.5.0)
      shell: pwsh
      run: |
        $root = "build-ninja-vcpkg-relwithdebinfo/vcpkg_installed/x64-windows"
        if (-not (Test-Path -LiteralPath $root)) { throw "missing $root" }
        $n = 0
        foreach ($sub in @("include", "debug/include", "share", "debug/share", "lib", "debug/lib", "bin", "debug/bin")) {
          $dir = Join-Path $root $sub
          if (Test-Path -LiteralPath $dir) {
            Get-ChildItem -LiteralPath $dir -Filter "SDL3*" -ErrorAction SilentlyContinue | ForEach-Object {
              Remove-Item -LiteralPath $_.FullName -Recurse -Force
              $n++
            }
          }
        }
        if ($n -eq 0) { throw "no vcpkg SDL3 payload found - step needs review" }
        Write-Host "removed $n vcpkg SDL3 payloads; FetchContent SDL 3.5.0 headers are now authoritative"

    - name: Build
      run: cmake --build --preset ninja-vcpkg-relwithdebinfo

    - name: Binary smoke test
      run: ./build-ninja-vcpkg-relwithdebinfo/devilutionx.exe --version

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: devilutionx-windows-x64-sdl3-gpu-scaler
        path: |
          build-ninja-vcpkg-relwithdebinfo/devilutionx.exe
          build-ninja-vcpkg-relwithdebinfo/devilutionx.pdb
          build-ninja-vcpkg-relwithdebinfo/*.dll
        if-no-files-found: warn
        retention-days: 7
