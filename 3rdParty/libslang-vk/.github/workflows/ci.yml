name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build
      - name: Install headless Vulkan (lavapipe + validation layers)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers libvulkan1
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-sanitize:
    name: linux (asan+ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DSLANGVK_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build
      - name: Install headless Vulkan (lavapipe + validation layers)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers libvulkan1
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # windows-msvc job dropped (maintainer decision 2026-10-17): the VS-generator
  # build is 5-8x slower than Ninja and the job hung on the runner well past any
  # plausible test runtime (all bounded core tests, 0 output). Windows remains
  # covered by the mingw-w64 job below, which builds static + shared and gates
  # on the same suite.
  windows-mingw64:
    name: windows (mingw-w64, static + shared)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Set up mingw-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          release: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Configure
        # Everything is fetched from source (glslang, Vulkan-Headers, volk, VMA):
        # no Vulkan SDK and no extra env vars needed. -fno-rtti applies via the
        # NOT-MSVC branch; export macros key off _WIN32, so the shared variant
        # gets dllexport/dllimport on mingw too.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        # Same skip behavior as the MSVC job: no ICD on the runner, so the
        # headless Vulkan test skips itself; core suite + examples still gate.
        run: ctest --test-dir build --output-on-failure
